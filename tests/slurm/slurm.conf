# One node, no accounting database, no cgroups: enough for squeue, sbatch, srun and scancel.
ClusterName=genai-test
SlurmctldHost=slurmbox
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
PropagateResourceLimits=NONE
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
SlurmdParameters=config_overrides
ReturnToService=2
AccountingStorageType=accounting_storage/none
JobCompType=jobcomp/none
MpiDefault=none
NodeName=slurmbox CPUs=4 RealMemory=4000 State=UNKNOWN
PartitionName=debug Nodes=slurmbox Default=YES MaxTime=1:00:00 State=UP
PartitionName=batch Nodes=slurmbox MaxTime=24:00:00 State=UP
